<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — IC1001 Surveillance</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0a0a0c;
            --surface:   #111114;
            --surface-2: #18181c;
            --border:    #222228;
            --border-2:  #2e2e38;
            --text:      #e8e8ec;
            --muted:     #6b6b7a;
            --accent:    #f97316;
            --green:     #22c55e;
            --red:       #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        /* Subtle grid bg */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(249,115,22,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(249,115,22,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
        }

        .card-header {
            padding: 28px 28px 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: var(--surface-2);
            border: 1px solid var(--border-2);
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 22px;
            margin: 0 auto 14px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .card-sub {
            font-size: 12px;
            color: var(--muted);
        }

        .card-body {
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Error */
        .error-box {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 7px;
            padding: 11px 13px;
            font-size: 12px;
            color: #fca5a5;
            line-height: 1.45;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        /* Section label */
        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
        }

        /* Face scan btn */
        .btn-face {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px;
            background: var(--surface-2);
            border: 1px solid var(--border-2);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn-face:hover {
            background: #1e1e24;
            border-color: var(--accent);
        }

        .btn-face-icon {
            width: 32px;
            height: 32px;
            background: rgba(249,115,22,0.12);
            border: 1px solid rgba(249,115,22,0.2);
            border-radius: 6px;
            display: grid;
            place-items: center;
            font-size: 15px;
        }

        .btn-face-text { text-align: left; }
        .btn-face-label { font-size: 13px; font-weight: 600; }
        .btn-face-sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-2);
        }

        /* Input */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }

        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border-2);
            border-radius: 7px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        input[type="password"]:focus {
            border-color: var(--accent);
        }

        input[type="password"]::placeholder { color: var(--muted); }

        /* Submit btn */
        .btn-submit {
            width: 100%;
            padding: 11px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-submit:hover { background: #ea6a05; }

        .card-footer {
            padding: 14px 28px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 11px;
            color: var(--muted);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <div class="card-icon">🎥</div>
        <div class="card-title">Room IC1001 Surveillance</div>
        <div class="card-sub">Admin access only — authenticate to continue</div>
    </div>

    <div class="card-body">

        {% if error %}
        <div class="error-box">
            <span>⚠</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Face Auth -->
        <div>
            <div class="section-label">Biometric Login</div>
            <a href="{{ url_for('face_auth') }}" class="btn-face">
                <div class="btn-face-icon">📸</div>
                <div class="btn-face-text">
                    <div class="btn-face-label">Face Recognition</div>
                    <div class="btn-face-sub">Scan using your webcam</div>
                </div>
            </a>
        </div>

        <div class="divider">or</div>

        <!-- Backup ID -->
        <div>
            <div class="section-label">Backup Admin ID</div>
            <form action="{{ url_for('backup_auth') }}" method="POST">
                <div class="input-group" style="margin-bottom: 10px;">
                    <label for="admin_id">Admin ID Code</label>
                    <input
                        type="password"
                        id="admin_id"
                        name="admin_id"
                        placeholder="Enter your backup ID"
                        required
                        autocomplete="off"
                    >
                </div>
                <button type="submit" class="btn-submit">Verify & Sign In</button>
            </form>
        </div>

    </div>

    <div class="card-footer">
        IC1001 · Smart Classroom Monitoring System
    </div>
</div>

</body>
</html>
