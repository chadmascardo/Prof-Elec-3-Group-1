<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV System Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121214;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1a1a1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 360px;
            text-align: center;
            border: 1px solid #2d2d34;
        }
        h2 { margin-bottom: 10px; color: #ffffff; }
        p { color: #888896; font-size: 14px; margin-bottom: 30px; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-face {
            background: #059669;
            margin-bottom: 25px;
        }
        .btn-face:hover { background: #047857; }
        .divider {
            position: relative;
            margin: 20px 0;
            text-align: center;
            color: #52525b;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #2d2d34;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }
        .error-box {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #b91c1c;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Room IC1001 Surveillance</h2>
    <p>Admin Authorization Portal Required</p>

    {% if error %}
    <div class="error-box">
        ❌ {{ error }}
    </div>
    {% endif %}

    <a href="{{ url_for('face_auth') }}" class="btn btn-face">📸 Scan Face Recognition</a>

    <div class="divider">OR USE BACKUP ID</div>

    <form action="{{ url_for('backup_auth') }}" method="POST">
        <input type="password" name="admin_id" placeholder="Enter Backup Admin ID Code" required autocomplete="off">
        <button type="submit" class="btn">Verify Security ID</button>
    </form>
</div>

</body>
</html>
