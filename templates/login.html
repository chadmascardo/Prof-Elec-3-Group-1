<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Security Login</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px 20px; }
        .login-box { max-width: 400px; margin: 0 auto; background: #1c1c1c; padding: 30px; border-radius: 12px; border: 1px solid #2d2d2d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #00adb5; margin-top: 0; }
        .btn-face { display: block; width: 100%; background: #00adb5; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-decoration: none; margin-bottom: 20px; }
        .btn-face:hover { background: #008c95; }
        .divider { border-top: 1px solid #333; margin: 20px 0; position: relative; }
        .divider span { position: absolute; top: -10px; left: 45%; background: #1c1c1c; padding: 0 10px; color: #777; font-size: 12px; }
        input[type="text"] { width: 90%; padding: 10px; background: #252525; border: 1px solid #444; border-radius: 6px; color: white; font-size: 14px; margin-bottom: 15px; text-align: center; }
        .btn-backup { width: 100%; background: #444; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-backup:hover { background: #555; }
        .error-msg { color: #ff5722; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔒 Admin Portal</h2>
        <p style="color: #888; font-size: 14px;">Select an authentication method to access the streams dashboard.</p>
        
        <a href="/face_auth" class="btn-face">📷 Scan Face Recognition</a>

        <div class="divider"><span>OR</span></div>

        <form action="/backup_auth" method="POST">
            <input type="text" name="admin_id" placeholder="Enter Admin ID Backup Code" required autocomplete="off">
            <button type="submit" class="btn-backup">Verify ID Code</button>
        </form>

        {% if error %}
            <div class="error-msg">❌ {{ error }}</div>
        {% endif %}
    </div>

</body>
</html>
